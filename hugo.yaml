baseURL: https://thisisyeongh.github.io/
title: Yeonghun Jung
author: Yeonghun Jung
theme: hugo-bearblog

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

# Series only. Posts also carry `topics` in front matter, not rendered yet.
taxonomies:
  series: series
disableKinds: [taxonomy]
ignoreErrors: [error-disable-taxonomy]

permalinks:
  blog: /:slug/

params:
  description: "Software engineer working on a GPU cloud. KAIST CS."
  title: Yeonghun Jung
  dateFormat: "2006-01-02"
  enablePostNavigator: false
  hideMadeWithLine: true

# English is the default at /, Korean lives under /ko/.
# A language link appears only on pages that have a translation (index.ko.md).
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    locale: en-us
    label: English
    weight: 1
    menu:
      main:
        - name: Blog
          url: /blog/
          weight: 20
  ko:
    locale: ko-kr
    label: 한국어
    weight: 2
    menu:
      main:
        - name: Blog
          url: /ko/blog/
          weight: 20

markup:
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
