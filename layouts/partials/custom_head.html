<link rel="stylesheet" href="{{ "css/syntax-light.css" | relURL }}" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="{{ "css/syntax-dark.css" | relURL }}" media="(prefers-color-scheme: dark)">
{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}]});"></script>
{{ end }}
<style>
  :root {
    --width: 700px;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --font-secondary: var(--font-main);
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-scale: 17px;
    --background-color: #fff;
    --heading-color: #111;
    --text-color: #222;
    --muted-color: #6b6b6b;
    --rule-color: #e5e5e5;
    --code-bg: #f5f5f5;
    --link-color: #1d4ed8;
    --visited-color: #1d4ed8;
    --blockquote-color: #444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #121212;
      --heading-color: #ededed;
      --text-color: #d6d6d6;
      --muted-color: #9a9a9a;
      --rule-color: #2e2e2e;
      --code-bg: #1e1e1e;
      --link-color: #8ab4f8;
      --visited-color: #8ab4f8;
      --blockquote-color: #bdbdbd;
    }
  }

  main { line-height: 1.7; }
  h1, h2, h3 { line-height: 1.3; letter-spacing: -0.01em; }
  h1 { font-size: 1.9em; margin-bottom: 0.2em; }
  h2 { font-size: 1.35em; margin-top: 2em; }
  h3 { font-size: 1.1em; margin-top: 1.6em; }
  main a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  nav a, .title, ul.blog-posts a, .series-box a { text-decoration: none; }

  time { font-family: var(--font-mono); font-size: 0.85em; color: var(--muted-color); }
  .post-meta { color: var(--muted-color); font-size: 0.9em; margin-top: 0; }

  code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code-bg); padding: 0.1em 0.3em; }
  pre code { background: none; padding: 0; font-size: 0.85em; }
  .highlight pre { padding: 0.9em 1em; border-radius: 4px; line-height: 1.5; }

  table { border-collapse: collapse; font-size: 0.92em; margin: 1.2em 0; }
  th, td { border-bottom: 1px solid var(--rule-color); padding: 0.45em 0.6em; text-align: left; vertical-align: top; }
  th { font-weight: 600; color: var(--heading-color); }

  blockquote { border-left: 3px solid var(--rule-color); font-style: normal; margin-left: 0; }
  hr { border-top: 1px solid var(--rule-color); }

  figure { margin: 1.6em 0; }
  figure img { display: block; margin: 0 auto; }
  figcaption { color: var(--muted-color); font-size: 0.88em; text-align: center; margin-top: 0.5em; }

  .footnotes { font-size: 0.88em; color: var(--muted-color); border-top: 1px solid var(--rule-color); margin-top: 3em; }

  .toc { font-size: 0.92em; border: 1px solid var(--rule-color); border-radius: 4px; padding: 0.6em 1em; margin: 1.5em 0; }
  .toc summary { cursor: pointer; color: var(--muted-color); }
  .toc ul { padding-left: 1.2em; margin: 0.4em 0; }

  .series-box { font-size: 0.92em; border-left: 3px solid var(--rule-color); padding: 0.2em 0 0.2em 1em; margin: 1.5em 0; color: var(--muted-color); }
  .series-box ol { margin: 0.4em 0 0; padding-left: 1.4em; }
  .series-box .current { color: var(--heading-color); font-weight: 600; }

  .home-section { margin-top: 2.2em; }
  .home-section h3 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-color); margin-bottom: 0.4em; }
  ul.series-list { list-style: none; padding: 0; }
  ul.series-list li { margin: 0.3em 0; }
  ul.series-list small { color: var(--muted-color); }

  footer { color: var(--muted-color); font-size: 0.85em; }
</style>
